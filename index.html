<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <meta name="theme-color" content="#176B52" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0D131E" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Monthly expense calculator and workspace for a Google Sheets expense log." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Money Saviour</title>
    <script>
      // Apply the saved theme before first paint so there is no flash.
      (function () {
        var pref = "system";
        try {
          pref = localStorage.getItem("ms.theme") || "system";
        } catch (e) {}
        var dark =
          pref === "dark" ||
          (pref === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
